# Publishes the trainer to GitHub Pages, which is what the iPhone installs from.
#
# ONE-OFF SETUP, and it cannot be automated: open
#   Settings > Pages > Build and deployment > Source
# and choose "GitHub Actions". A workflow token is not allowed to create the
# Pages site itself — trying it fails with "Resource not accessible by
# integration" — so this one click has to be done by hand, once.
#
# After that, every push to the branches below republishes the app, and the
# phone picks the new version up on its next launch.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/iphone-app
      - claude/dreamy-euler-cgmy9m
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the app files are all present
        run: |
          test -f app/index.html
          test -f app/manifest.webmanifest
          test -f app/sw.js
          test -f app/icons/icon-180.png
          node -e "JSON.parse(require('fs').readFileSync('app/manifest.webmanifest','utf8'))"
          echo "app/ looks deployable"

      # Fails with a clear message until Pages is switched on in Settings.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
